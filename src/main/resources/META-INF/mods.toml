# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="${loader_version_range}"

# License
license="GNU GPLv3"

issueTrackerURL="https://github.com/gottsch/gottsch-minecraft-EverCrops-Farmers-Delight/issues" #optional
updateJSONURL="https://raw.githubusercontent.com/gottsch/gottsch-minecraft-EverCrops-Farmers-Delight/1.20.1-main/update.json"
displayURL="https://www.curseforge.com/minecraft/mc-mods/evercrops-farmers-delight"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod - there's a few well known ${} variables useable here or just hardcode it
version="${mod_version}" #mandatory

 # A display name for the mod
displayName="${mod_name}" #mandatory

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://www.curseforge.com/minecraft/mc-mods/evercrops-farmersdelight" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="evercrops_logo.png" #optional

# A text field displayed in the mod UI
credits="" #optional

# A text field displayed in the mod UI
authors="${mod_authors}" #optional

# The description text for the mod (multi line!) (#mandatory)
description="${mod_description}"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="evercrops"
mandatory=true
versionRange="${evercrops_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="farmersdelight"
mandatory=true
versionRange="${fd_version_range}"
ordering="AFTER"
side="BOTH"